<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reg de Plantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .due-date { color: #ef4444; font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20">

    <!-- CONTINGUT PRINCIPAL -->
    <div class="max-w-md mx-auto p-4">
        <header class="flex justify-between items-center mb-6 py-2">
            <h1 class="text-2xl font-bold text-green-700">🌿 El meu Jardí</h1>
            <button onclick="obrirFormulari()" class="bg-green-600 text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center text-3xl font-light active:bg-green-800">
                +
            </button>
        </header>

        <div id="llistaPlantes" class="space-y-4">
            <!-- Les plantes sortiran aquí -->
        </div>
    </div>

    <!-- FORMULARI (MODAL) -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm shadow-2xl overflow-y-auto max-h-[90vh]">
            <h2 id="modalTitol" class="text-xl font-bold mb-4 text-gray-800">Nova Planta</h2>
            
            <input type="hidden" id="idEdicio">
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase">Nom</label>
                    <input type="text" id="nomPlanta" class="w-full border-b-2 border-gray-100 p-2 outline-none focus:border-green-500">
                </div>
                
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase">Cada quants dies es rega?</label>
                    <input type="number" id="freqPlanta" value="3" class="w-full border-b-2 border-gray-100 p-2 outline-none focus:border-green-500">
                </div>
                
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase">Últim reg (pots triar passat)</label>
                    <input type="date" id="dataReg" class="w-full border-b-2 border-gray-100 p-2 outline-none focus:border-green-500 bg-white">
                </div>
                
                <div id="seccioFoto">
                    <label class="text-xs font-bold text-gray-400 uppercase text-red-500">Foto (OBLIGATÒRIA)</label>
                    <input type="file" id="fotoPlanta" accept="image/*" class="w-full text-sm mt-2">
                </div>
            </div>
            
            <div class="flex justify-end space-x-3 mt-8">
                <button onclick="tancarFormulari()" class="px-4 py-2 text-gray-400 font-medium italic">Cancel·lar</button>
                <button onclick="guardarPlanta()" id="btnGuardar" class="px-6 py-2 bg-green-600 text-white rounded-xl font-bold shadow-md">GUARDAR</button>
            </div>
        </div>
    </div>

    <script>
        // CARREGAR DADES AMB SEGURETAT
        let plantes = [];
        try {
            const dadesGuardades = localStorage.getItem('plantes_v1');
            plantes = dadesGuardades ? JSON.parse(dadesGuardades) : [];
        } catch (e) {
            console.error("Error carregant dades", e);
            plantes = [];
        }

        // MOSTRAR FORMULARI
        function obrirFormulari(id = null) {
            const modal = document.getElementById('modal');
            const dataInput = document.getElementById('dataReg');
            
            // Data d'avui per defecte
            const avui = new Date().toISOString().split('T')[0];
            dataInput.value = avui;

            if (id) {
                const p = plantes.find(x => x.id === id);
                document.getElementById('idEdicio').value = id;
                document.getElementById('modalTitol').innerText = "Editar " + p.name;
                document.getElementById('nomPlanta').value = p.name;
                document.getElementById('freqPlanta').value = p.freq;
                document.getElementById('dataReg').value = p.lastReg.split('T')[0];
                document.getElementById('seccioFoto').style.display = 'none';
            } else {
                document.getElementById('idEdicio').value = "";
                document.getElementById('modalTitol').innerText = "Nova Planta";
                document.getElementById('nomPlanta').value = "";
                document.getElementById('freqPlanta').value = "3";
                document.getElementById('seccioFoto').style.display = 'block';
                document.getElementById('fotoPlanta').value = "";
            }
            modal.classList.remove('hidden');
        }

        function tancarFormulari() {
            document.getElementById('modal').classList.add('hidden');
        }

        // GUARDAR PLANTA
        function guardarPlanta() {
            const idEdicio = document.getElementById('idEdicio').value;
            const nom = document.getElementById('nomPlanta').value;
            const freq = parseInt(document.getElementById('freqPlanta').value);
            const dataRegValue = document.getElementById('dataReg').value;
            const fotoFile = document.getElementById('fotoPlanta').files[0];

            if (!nom || !dataRegValue) return alert("Posa el nom i la data!");

            const dataISO = new Date(dataRegValue).toISOString();

            if (idEdicio) {
                // MODIFICAR EXISTENT
                plantes = plantes.map(p => {
                    if (p.id == idEdicio) {
                        return { ...p, name: nom, freq: freq, lastReg: dataISO };
                    }
                    return p;
                });
                actualitzarTot();
            } else {
                // CREAR NOVA (Necessita foto)
                if (!fotoFile) return alert("Has de posar una foto!");
                
                const lector = new FileReader();
                lector.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        // Comprimir
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        const midaMax = 400;
                        let ample = img.width;
                        let alt = img.height;
                        
                        if (ample > alt) {
                            if (ample > midaMax) { alt *= midaMax / ample; ample = midaMax; }
                        } else {
                            if (alt > midaMax) { ample *= midaMax / alt; alt = midaMax; }
                        }
                        canvas.width = ample;
                        canvas.height = alt;
                        context.drawImage(img, 0, 0, ample, alt);
                        
                        const novaPlanta = {
                            id: Date.now(),
                            name: nom,
                            freq: freq,
                            lastReg: dataISO,
                            photo: canvas.toDataURL('image/jpeg', 0.7)
                        };
                        
                        plantes.push(novaPlanta);
                        actualitzarTot();
                    };
                    img.src = e.target.result;
                };
                lector.readAsDataURL(fotoFile);
            }
        }

        function regarPlanta(id) {
            plantes = plantes.map(p => {
                if (p.id === id) p.lastReg = new Date().toISOString();
                return p;
            });
            actualitzarTot();
        }

        function esborrarPlanta(id) {
            if (confirm("Vols eliminar-la?")) {
                plantes = plantes.filter(p => p.id !== id);
                actualitzarTot();
            }
        }

        function actualitzarTot() {
            localStorage.setItem('plantes_v1', JSON.stringify(plantes));
            dibuixarPlantes();
            tancarFormulari();
        }

        function dibuixarPlantes() {
            const llista = document.getElementById('llistaPlantes');
            llista.innerHTML = "";

            if (plantes.length === 0) {
                llista.innerHTML = '<p class="text-center text-gray-400 mt-10 italic">No hi ha plantes.<br>Clica el botó + per afegir-ne.</p>';
                return;
            }

            plantes.forEach(p => {
                const dataUltim = new Date(p.lastReg);
                const dataPropera = new Date(dataUltim);
                dataPropera.setDate(dataUltim.getDate() + p.freq);
                
                const avui = new Date();
                avui.setHours(0,0,0,0);
                const proper = new Date(dataPropera);
                proper.setHours(0,
