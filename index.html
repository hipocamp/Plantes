<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reg de Plantes TEST</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 pb-20">

    <div class="max-w-md mx-auto p-4">
        <header class="flex justify-between items-center mb-6 py-4">
            <h1 class="text-2xl font-bold text-green-700">🌿 El meu Jardí</h1>
            <div class="space-x-2">
                <!-- BOTÓ PER NETEJAR TOT SI FALLA -->
                <button onclick="resetejarApp()" class="text-[10px] bg-red-100 text-red-600 px-2 py-1 rounded">Reset</button>
                <button onclick="obrirFormulari()" class="bg-green-600 text-white w-12 h-12 rounded-full shadow-lg text-3xl font-light">
                    +
                </button>
            </div>
        </header>

        <div id="llistaPlantes" class="space-y-4 text-center text-gray-500 pt-10">
            Carregant...
        </div>
    </div>

    <!-- FORMULARI -->
    <div id="modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4">Nova Planta</h2>
            <div class="space-y-4">
                <input type="text" id="nom" placeholder="Nom de la planta" class="w-full border-b p-2 outline-none">
                <input type="number" id="freq" value="3" class="w-full border-b p-2 outline-none">
                <input type="date" id="data" class="w-full border-b p-2 outline-none bg-white">
                <input type="file" id="foto" accept="image/*" class="w-full text-sm">
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button onclick="document.getElementById('modal').classList.add('hidden')" class="px-4 py-2 text-gray-400">Cancel·lar</button>
                <button onclick="guardar()" class="px-6 py-2 bg-green-600 text-white rounded-lg font-bold">GUARDAR</button>
            </div>
        </div>
    </div>

    <script>
        // 1. GESTIÓ D'ERRORS CRÍTICS
        window.onerror = function(msg) { alert("Error detectat: " + msg); };

        let plantes = [];

        // 2. CARREGAR DADES
        function carregar() {
            try {
                const guardat = localStorage.getItem('plantes_v2');
                plantes = guardat ? JSON.parse(guardat) : [];
                dibuixar();
            } catch (e) {
                alert("Error llegint dades. Fes Reset.");
                plantes = [];
            }
        }

        function resetejarApp() {
            if(confirm("Vols esborrar-ho tot per arreglar l'app?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function obrirFormulari() {
            console.log("Botó premut"); // Per veure al navegador de PC
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('data').value = new Date().toISOString().split('T')[0];
        }

        function guardar() {
            const nom = document.getElementById('nom').value;
            const freq = parseInt(document.getElementById('freq').value);
            const data = document.getElementById('data').value;
            const fotoFile = document.getElementById('foto').files[0];

            if (!nom || !fotoFile || !data) {
                alert("Falta nom, data o foto!");
                return;
            }

            const lector = new FileReader();
            lector.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 300; // Molt petita per evitar errors de memòria
                    canvas.height = (img.height * 300) / img.width;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const nova = {
                        id: Date.now(),
                        name: nom,
                        freq: freq,
                        last: new Date(data).toISOString(),
                        photo: canvas.toDataURL('image/jpeg', 0.6)
                    };
                    
                    plantes.push(nova);
                    localStorage.setItem('plantes_v2', JSON.stringify(plantes));
                    document.getElementById('modal').classList.add('hidden');
                    dibuixar();
                };
                img.src = e.target.result;
            };
            lector.readAsDataURL(fotoFile);
        }

        function regar(id) {
            plantes = plantes.map(p => {
                if (p.id === id) p.last = new Date().toISOString();
                return p;
            });
            localStorage.setItem('plantes_v2', JSON.stringify(plantes));
            dibuixar();
        }

        function dibuixar() {
            const llista = document.getElementById('llistaPlantes');
            llista.innerHTML = "";

            if (plantes.length === 0) {
                llista.innerHTML = "No hi ha plantes. Clica +";
                return;
            }

            plantes.forEach(p => {
                const last = new Date(p.last);
                const next = new Date(last);
                next.setDate(last.getDate() + p.freq);
                const isDue = new Date() >= next;

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow flex items-center border-l-4 " + (isDue ? "border-red-500" : "border-green-500");
                card.innerHTML = `
                    <img src="${p.photo}" class="w-12 h-12 rounded-full object-cover">
                    <div class="ml-3 flex-1 text-left">
                        <h3 class="font-bold text-sm">${p.name}</h3>
                        <p class="text-[10px] text-gray-400">Toca: ${next.toLocaleDateString()}</p>
                    </div>
                    <button onclick="regar(${p.id})" class="bg-blue-500 text-white text-[10px] px-3 py-2 rounded-lg font-bold">REGAR</button>
                `;
                llista.appendChild(card);
            });
        }

        // INICIAR SEMPRE
        carregar();
    </script>
</body>
</html>
