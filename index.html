<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Reg PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/628/628283.png">
    <style>
        .due-date { color: #ef4444; font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 pb-20">

    <div class="max-w-md mx-auto p-4">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-green-800 tracking-tight">🌿 El meu Jardí</h1>
            <button onclick="obrirModal()" class="bg-green-600 text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center text-2xl active:scale-95 transition-transform">
                +
            </button>
        </header>

        <div id="plantList" class="space-y-4"></div>
    </div>

    <!-- MODAL -->
    <div id="modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm shadow-2xl overflow-y-auto max-h-[90vh]">
            <h2 id="modalTitle" class="text-xl font-bold mb-4 text-gray-800">Nova Planta</h2>
            
            <input type="hidden" id="editId">
            
            <label class="text-xs font-bold text-gray-400 uppercase">Nom de la planta</label>
            <input type="text" id="plantName" class="w-full border-b-2 border-gray-100 p-2 mb-4 outline-none focus:border-green-500">
            
            <label class="text-xs font-bold text-gray-400 uppercase">Cada quants dies es rega?</label>
            <input type="number" id="plantFreq" value="3" class="w-full border-b-2 border-gray-100 p-2 mb-4 outline-none focus:border-green-500">
            
            <label class="text-xs font-bold text-gray-400 uppercase">Quan la vas regar per últim cop?</label>
            <input type="date" id="lastWateredInput" class="w-full border-b-2 border-gray-100 p-2 mb-4 outline-none focus:border-green-500 bg-white">
            
            <div id="photoSection">
                <label class="text-xs font-bold text-gray-400 uppercase">Foto</label>
                <input type="file" id="plantPhoto" accept="image/*" class="w-full mb-6 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-green-50 file:text-green-700">
            </div>
            
            <div class="flex justify-end space-x-3 mt-4">
                <button onclick="tancarModal()" class="px-4 py-2 text-gray-400 font-medium">Cancel·lar</button>
                <button onclick="savePlant()" id="btnGuardar" class="px-6 py-2 bg-green-600 text-white rounded-xl font-bold shadow-md">GUARDAR</button>
            </div>
        </div>
    </div>

    <script>
        let plants = JSON.parse(localStorage.getItem('myPlants')) || [];
        let currentEditId = null;

        // Estableix la data d'avui per defecte al calendari
        function formatDataISO(date) {
            return date.toISOString().split('T')[0];
        }

        function obrirModal(id = null) {
            currentEditId = id;
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const photoSection = document.getElementById('photoSection');
            const dateInput = document.getElementById('lastWateredInput');
            
            modal.classList.remove('hidden');
            dateInput.value = formatDataISO(new Date()); // Per defecte: avui

            if (id) {
                const p = plants.find(plant => plant.id === id);
                title.innerText = "Editar " + p.name;
                document.getElementById('plantName').value = p.name;
                document.getElementById('plantFreq').value = p.freq;
                dateInput.value = formatDataISO(new Date(p.lastWatered));
                photoSection.classList.add('hidden');
            } else {
                title.innerText = "Nova Planta";
                document.getElementById('plantName').value = "";
                document.getElementById('plantFreq').value = "3";
                photoSection.classList.remove('hidden');
            }
        }

        function tancarModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        async function savePlant() {
            const name = document.getElementById('plantName').value;
            const freq = parseInt(document.getElementById('plantFreq').value);
            const manualDate = document.getElementById('lastWateredInput').value;
            const photoFile = document.getElementById('plantPhoto').files[0];

            if (!name || !manualDate || (!currentEditId && !photoFile)) {
                alert("Emplena tots els camps i la foto!");
                return;
            }

            // Crear data a partir de l'input (format local)
            const lastWatered = new Date(manualDate).toISOString();

            if (currentEditId) {
                plants = plants.map(p => {
                    if (p.id === currentEditId) {
                        return { ...p, name: name, freq: freq, lastWatered: lastWatered };
                    }
                    return p;
